name: ACAS Pro CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  schedule:
    - cron: '0 2 * * *'  # 每日凌晨2点定时跑

env:
  PYTHON_VERSION: '3.11'
  PIP_CACHE: ~/.cache/pip

jobs:

  # ── Job 1: Lint & Format ──────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE }}
          key: ${{ runner.os }}-lint-${{ hashFiles('**/requirements*.txt') }}

      - name: Install lint tools
        run: pip install ruff mypy

      - name: ruff check (lint)
        run: ruff check src/

      - name: ruff format check
        run: ruff format --check src/

      - name: mypy type check
        run: mypy src/ --ignore-missing-imports || true


  # ── Job 2: Unit Tests ──────────────────────────────────────────
  unit-tests:
    name: Unit Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE }}
          key: ${{ runner.os }}-pytest-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-xdist

      - name: Run unit tests
        env:
          SECRET_KEY: test-secret-key-for-ci
          ACAS_ENV: testing
          SKIP_E2E: '1'
        run: |
          pytest tests/ \
            --ignore=tests/e2e_playwright \
            --ignore=tests/test_e2e.py \
            -x \
            -q \
            --cov=src/acas_pro \
            --cov-report=term \
            --cov-report=xml \
            --cov-fail-under=5

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false


  # ── Job 3: Integration Tests (needs Postgres) ─────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: acas_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/acas_test
          SECRET_KEY: test-secret-key-for-ci
          ACAS_ENV: testing
        run: |
          pytest tests/ -k "integration" -v || echo "No integration tests found, skipping."

      - name: Run API tests (Flask)
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/acas_test
          SECRET_KEY: test-secret-key-for-ci
          ACAS_ENV: testing
          FLASK_ENV: testing
        run: |
          # Start Flask in background, wait for ready, run tests, then kill
          python -m flask run --port 5555 &
          FLASK_PID=$!
          sleep 5
          pytest tests/test_e2e.py -v || true
          kill $FLASK_PID || true


  # ── Job 4: Security Scan ───────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run bandit
        run: |
          pip install bandit
          bandit -r src/ -f json -o bandit-report.json || true
          bandit -r src/  # print human-readable output

      - name: Run pip-audit
        run: |
          pip install pip-audit
          pip-audit || true

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json


  # ── Job 5: Coverage Summary (PR comment) ──────────────────────
  coverage-summary:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage.xml

      - name: Comment coverage on PR
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 50
