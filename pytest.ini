[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --cov=src/acas_pro
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=0

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    e2e: marks tests as end-to-end tests requiring Playwright browser
    chaos: marks tests as chaos/resilience tests requiring running server
    performance: marks tests as performance benchmarks requiring running server

[coverage:run]
source = src/acas_pro
omit = 
    */tests/*
    */__pycache__/*
    */migrations/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
norecursedirs = .git .tox dist build *.egg tests/test_e2e.py
