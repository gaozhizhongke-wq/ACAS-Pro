# Default values for acas-pro.
# This is a YAML-formatted file.

replicaCount: 3

image:
  repository: acas-pro
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: your-domain.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: acas-pro-tls
      hosts:
        - your-domain.com

resources:
  requests:
    memory: "256Mi"
    cpu: "250m"
  limits:
    memory: "512Mi"
    cpu: "500m"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

postgresql:
  enabled: true
  auth:
    username: acas
    password: changeme
    database: acas
  primary:
    persistence:
      enabled: true
      size: 10Gi

redis:
  enabled: true
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 5Gi

env:
  ENVIRONMENT: production
  LOG_LEVEL: INFO

secrets:
  SECRET_KEY: "your-secret-key-32-chars-long"
  DEEPSEEK_API_KEY: "your-api-key"

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
