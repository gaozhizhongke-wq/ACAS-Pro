# ACAS Pro Prometheus Alerting Rules
# 告警规则 - 监控关键指标

groups:
  # ============================================
  # 应用层告警
  # ============================================
  - name: acas_application
    rules:
      # HTTP 错误率
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(acas_http_requests_total{status=~"5.."}[5m]))
            /
            sum(rate(acas_http_requests_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "HTTP 5xx 错误率超过 5%"
          description: "过去5分钟内 5xx 错误率为 {{ $value | humanizePercentage }}"

      # 请求延迟
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, 
            rate(acas_request_duration_seconds_bucket[5m])
          ) > 2.0
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "P95 延迟超过 2 秒"
          description: "过去10分钟 P95 延迟为 {{ $value }}s"

      # 请求量突降
      - alert: RequestRateDrop
        expr: |
          (
            sum(rate(acas_http_requests_total[5m]))
            /
            sum(rate(acas_http_requests_total[5m] offset 1h))
          ) < 0.3
        for: 15m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "请求量下降超过 70%"
          description: "当前请求量仅为1小时前的 {{ $value | humanizePercentage }}"

  # ============================================
  # 系统资源告警
  # ============================================
  - name: acas_system
    rules:
      # CPU 使用率
      - alert: HighCPUUsage
        expr: acas_cpu_percent > 85
        for: 10m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "CPU 使用率超过 85%"
          description: "CPU 使用率为 {{ $value }}%"

      - alert: CriticalCPUUsage
        expr: acas_cpu_percent > 95
        for: 5m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "CPU 使用率超过 95%"
          description: "CPU 使用率为 {{ $value }}%，系统可能不可响应"

      # 内存使用率
      - alert: HighMemoryUsage
        expr: acas_memory_percent > 85
        for: 10m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "内存使用率超过 85%"
          description: "内存使用率为 {{ $value }}%"

      - alert: CriticalMemoryUsage
        expr: acas_memory_percent > 95
        for: 5m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "内存使用率超过 95%"
          description: "内存使用率为 {{ $value }}%，OOM 风险极高"

      # 磁盘使用率
      - alert: HighDiskUsage
        expr: acas_disk_percent > 85
        for: 30m
        labels:
          severity: warning
          team: infra
        annotations:
          summary: "磁盘使用率超过 85%"
          description: "磁盘使用率为 {{ $value }}%"

      - alert: CriticalDiskUsage
        expr: acas_disk_percent > 95
        for: 10m
        labels:
          severity: critical
          team: infra
        annotations:
          summary: "磁盘使用率超过 95%"
          description: "磁盘使用率为 {{ $value }}%，即将写满"

  # ============================================
  # 数据库告警
  # ============================================
  - name: acas_database
    rules:
      # 数据库连接
      - alert: DatabaseConnectionFailed
        expr: acas_database_up == 0
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "数据库连接失败"
          description: "数据库健康检查失败超过 2 分钟"

      # 慢查询
      - alert: SlowDatabaseQueries
        expr: |
          histogram_quantile(0.99,
            rate(acas_db_query_duration_seconds_bucket[5m])
          ) > 5.0
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "P99 数据库查询超过 5 秒"
          description: "数据库 P99 延迟为 {{ $value }}s"

  # ============================================
  # 业务指标告警
  # ============================================
  - name: acas_business
    rules:
      # 预测引擎异常
      - alert: ForecastEngineDown
        expr: acas_forecast_requests_failed_total / acas_forecast_requests_total > 0.1
        for: 15m
        labels:
          severity: warning
          team: ml
        annotations:
          summary: "预测引擎失败率超过 10%"
          description: "预测请求失败率为 {{ $value | humanizePercentage }}"

      # 内容发布失败
      - alert: ContentPublishFailures
        expr: |
          sum(rate(acas_content_publish_total{status="failed"}[30m]))
          /
          sum(rate(acas_content_publish_total[30m]))
          > 0.2
        for: 30m
        labels:
          severity: warning
          team: content
        annotations:
          summary: "内容发布失败率超过 20%"
          description: "过去30分钟发布失败率为 {{ $value | humanizePercentage }}"

      # 账号授权过期
      - alert: AccountTokenExpiring
        expr: |
          acas_account_token_expires_in_hours < 24
        for: 1h
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "平台账号 Token 即将过期"
          description: "有 {{ $value }} 个账号 Token 将在24小时内过期"

  # ============================================
  # 安全告警
  # ============================================
  - name: acas_security
    rules:
      # 登录失败率
      - alert: HighLoginFailureRate
        expr: |
          sum(rate(acas_auth_attempts_total{result="failed"}[5m]))
          /
          sum(rate(acas_auth_attempts_total[5m]))
          > 0.3
        for: 10m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "登录失败率超过 30%"
          description: "可能存在暴力破解攻击，失败率 {{ $value | humanizePercentage }}"

      # 限流触发
      - alert: RateLimitTriggered
        expr: sum(rate(acas_rate_limit_rejected_total[5m])) > 10
        for: 5m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "限流触发频繁"
          description: "过去5分钟被限流拒绝的请求速率为 {{ $value }}/s"
