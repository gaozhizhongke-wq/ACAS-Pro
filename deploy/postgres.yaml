apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: acas-pro
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "acas_pro"
            - name: POSTGRES_USER
              value: "acas_user"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: acas-pro-secrets
                  key: DB_PASSWORD
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: acas-pro
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
  clusterIP: None
