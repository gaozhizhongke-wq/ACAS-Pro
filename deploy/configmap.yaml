apiVersion: v1
kind: ConfigMap
metadata:
  name: acas-pro-config
  namespace: acas-pro
data:
  # 应用配置
  APP_NAME: "ACAS Pro"
  APP_VERSION: "1.0.0"
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  
  # 数据库
  DB_HOST: "postgres.acas-pro.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "acas_pro"
  
  # Redis
  REDIS_HOST: "redis.acas-pro.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  
  # 监控
  METRICS_ENABLED: "true"
  METRICS_PORT: "9090"
  
  # LLM
  LLM_PROVIDER: "openai"
  LLM_MODEL: "gpt-4"
