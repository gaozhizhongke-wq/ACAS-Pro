apiVersion: v1
kind: Namespace
metadata:
  name: acas-pro
  labels:
    name: acas-pro
    environment: production
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: acas-pro-config
  namespace: acas-pro
data:
  ENVIRONMENT: "production"
  DATABASE_URL: "postgresql://acas:changeme@postgres:5432/acas"
  REDIS_URL: "redis://redis:6379/0"
---
apiVersion: v1
kind: Secret
metadata:
  name: acas-pro-secrets
  namespace: acas-pro
type: Opaque
stringData:
  SECRET_KEY: "your-secret-key-32-chars-long"
  DEEPSEEK_API_KEY: "your-api-key"
  DB_PASSWORD: "changeme"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acas-pro-app
  namespace: acas-pro
  labels:
    app: acas-pro
    tier: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: acas-pro
      tier: backend
  template:
    metadata:
      labels:
        app: acas-pro
        tier: backend
    spec:
      containers:
      - name: app
        image: acas-pro:latest
        ports:
        - containerPort: 5000
          name: http
        envFrom:
        - configMapRef:
            name: acas-pro-config
        - secretRef:
            name: acas-pro-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: acas-pro-service
  namespace: acas-pro
spec:
  selector:
    app: acas-pro
    tier: backend
  ports:
  - port: 80
    targetPort: 5000
    name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: acas-pro-ingress
  namespace: acas-pro
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - your-domain.com
    secretName: acas-pro-tls
  rules:
  - host: your-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: acas-pro-service
            port:
              number: 80
