# ACAS Pro Nginx 配置
# 限流 + 反向代理 + 安全头
# 放入 /etc/nginx/conf.d/acas-pro.conf

# ============================================
# 上游 API 服务
# ============================================
upstream acas_backend {
    # Unix socket（生产推荐）注释下行，取消注释 Unix socket
    server 127.0.0.1:8000;
    # server unix:/tmp/acas-pro.sock;  # Unix socket 模式
    keepalive 32;
}

# ============================================
# 限流区域定义
# ============================================
# 按客户端 IP 限制（通用）
limit_req_zone $binary_remote_addr zone=general:10m rate=60r/m;
# 按客户端 IP 限制（认证端 - 更严格）
limit_req_zone $binary_remote_addr zone=auth:1m rate=5r/m;
# 按客户端 IP 限制（搜索/导出 - 中等）
limit_req_zone $binary_remote_addr zone=search:10m rate=30r/m;

# 状态存储（共享内存，key=value 格式）
limit_req_zone $binary_remote_addr zone=status:10m rate=100r/m;

# 连接数限制（每个 IP）
limit_conn_zone $binary_remote_addr zone=addr:10m;

# ============================================
# 主服务器块
# ============================================
server {
    listen 80;
    # listen 443 ssl http2;  # HTTPS
    server_name _;
    server_tokens off;

    # --- 安全头 ---
    # XSS 保护
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'" always;

    # --- 请求大小限制 ---
    client_max_body_size 10m;
    client_body_buffer_size 128k;

    # --- 超时设置 ---
    proxy_connect_timeout 30s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 60s;

    # --- 日志格式 ---
    log_format acas_log '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       'rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time '
                       'cs=$upstream_cache_status';
    access_log /var/log/nginx/acas-pro_access.log acas_log;
    error_log /var/log/nginx/acas-pro_error.log warn;

    # --- 静态文件 ---
    location /static/ {
        alias /var/www/acas-pro/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # 开启 gzip 静态压缩
        gzip_static on;
        gzip_types text/css image/svg+xml application/font-woff2;
    }

    # --- 健康检查 ---
    location /health {
        proxy_pass http://acas_backend;
        # 不计��限流
        limit_req zone=general nogr;
        access_log off;
        # 健康检查返回简单内容
        proxy_set_header Content-Type "application/json";
        # 允许无认证访问
        auth_basic off;
    }

    # --- Prometheus 指标 ---
    location /metrics {
        proxy_pass http://acas_backend;
        # 限流（宽松）
        limit_req zone=status nogr burst=20;
        access_log off;
        # 允许无认证访问（内网）
        # 生产环境应该用网络 ACL 限制
        # allow 10.0.0.0/8;
        # deny all;
        auth_basic off;
    }

    # --- 认证 API ---
    location /api/v1/auth/ {
        proxy_pass http://acas_backend;
        # 严格限流
        limit_req zone=auth nogr burst=5;
        # 错误日志（可审计）
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 认证端点特殊超时（验证码可能较慢）
        proxy_read_timeout 120s;
    }

    # --- 搜索/导出 API ---
    location ~ ^/api/v1/(search|export|download)/ {
        proxy_pass http://acas_backend;
        # 中等限流
        limit_req zone=search nogr burst=10;
        # 搜索可能耗时较长
        proxy_read_timeout 180s;
        # 允许 gzip 压缩
        proxy_set_header Accept-Encoding "gzip";
    }

    # --- 状态 API ---
    location ~ ^/api/v1/users/ {
        proxy_pass http://acas_backend;
        limit_req zone=status nogr burst=20;
    }

    # --- 通用 API ---
    location /api/v1/ {
        proxy_pass http://acas_backend;
        # 默认限流
        limit_req zone=general nogr burst=10;
        # 转发真实 IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        # 支持 WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # --- 根路径 ---
    location / {
        return 404 '{"error": "not_found"}';
        add_header Content-Type "application/json";
    }
}

# ============================================
# 错误页面
# ============================================
error_page 400 401 403 404 405 429 500 502 503 504 = /error.json;

location = /error.json {
    internal;
    default_type application/json;
    set $code 500;
    if (int(NGX_STATUS) = 400) { set $code 400; }
    if (int(NGX_STATUS) = 401) { set $code 401; }
    if (int(NGX_STATUS) = 403) { set $code 403; }
    if (int(NGX_STATUS) = 404) { set $code 404; }
    if (int(NGX_STATUS) = 429) { set $code 429; }
    if (int(NGX_STATUS) = 500) { set $code 500; }
    if (int(NGX_STATUS) = 502) { set $code 502; }
    if (int(NGX_STATUS) = 503) { set $code 503; }
    return 200 '{"code": $code, "error": "service_error"}';
}