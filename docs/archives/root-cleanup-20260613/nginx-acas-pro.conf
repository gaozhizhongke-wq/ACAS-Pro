# ACAS-Pro Nginx HTTPS Reverse Proxy Configuration
# Place this file at: /etc/nginx/sites-available/acas-pro
# Then symlink: ln -s /etc/nginx/sites-available/acas-pro /etc/nginx/sites-enabled/
#
# Prerequisites:
#   sudo apt install nginx certbot python3-certbot-nginx
#   sudo certbot --nginx -d your-domain.com -d www.your-domain.com
#
# After Certbot runs, it will auto-update this file with SSL cert paths.

upstream acas_backend {
    server 127.0.0.1:8000;
    # Add more backend servers for load balancing:
    # server 127.0.0.1:8001;
    # server 127.0.0.1:8002;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;

    # Let Certbot handle this block during certificate issuance
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server block (updated by Certbot)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # ── SSL Configuration (managed by Certbot) ──────────────────────────
    # These paths are updated automatically by: sudo certbot --nginx
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security Headers ────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'" always;

    # ── Gzip Compression ───────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # ── Rate Limiting (requires Redis for multi-worker) ────────────────
    # Uncomment after Redis is installed:
    # limit_req_zone $binary_remote_addr zone=acas_api:10m rate=10r/s;
    # limit_req_zone $binary_remote_addr zone=acas_login:10m rate=2r/s;
    # limit_req_status 429;

    # ── Main Application Proxy ─────────────────────────────────────────
    location / {
        proxy_pass http://acas_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support (if using Socket.IO or similar)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # File upload size limit
        client_max_body_size 50M;
    }

    # ── API Rate Limiting (stricter for auth endpoints) ───────────────
    location /api/auth/ {
        # limit_req zone=acas_login burst=5 nodelay;
        proxy_pass http://acas_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Static Files (served directly by Nginx for performance) ───────
    location /static/ {
        alias /path/to/acas-pro/static/;
        expires 30d;
        access_log off;
    }

    # ── Health Check Endpoint (no rate limiting) ──────────────────────
    location /health {
        proxy_pass http://acas_backend;
        access_log off;
    }

    # ── Deny access to hidden files ────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Custom Error Pages ─────────────────────────────────────────────
    error_page 429 = @ratelimited;
    location @ratelimited {
        default_type application/json;
        return 429 '{"error":"Rate limit exceeded","message":"Too many requests. Please try again later."}';
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
