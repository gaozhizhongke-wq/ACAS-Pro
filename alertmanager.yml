# ACAS Pro Alertmanager 配置
# 用于 Prometheus 告警路由到飞书/钉钉/企业微信
# 使用: alertmanager.yml

global:
  resolve_timeout: 5m

# 飞书机器人配置（使用 sign 签名）
receivers:
  # ============================================
  # 飞书 Webhook
  # ============================================
  - name: 'feishu'
    webhook_configs:
      - url: 'http://localhost:9093/api/v1/alerts'
        # 告警内容模板（用于飞书自定义机器人）
        send_resolved: true
        http_config:
          follow_redirects: true

  # ============================================
  # 钉钉群 Webhook
  # ============================================
  - name: 'dingtalk'
    webhook_configs:
      - url: 'http://localhost:9093/api/v1/alerts'
        send_resolved: true
        http_config:
          follow_redirects: true

  # ============================================
  # 企业微信群 Webhook
  # ============================================
  - name: 'wecom'
    webhook_configs:
      - url: 'http://localhost:9093/api/v1/alerts'
        send_resolved: true
        http_config:
          follow_redirects: true

  # ============================================
  # 故障自愈（自动处理）
  # ============================================
  - name: 'critical-pager'
    webhook_configs:
      - url: 'http://localhost:9093/api/v1/alerts'
        send_resolved: false
        http_config:
          follow_redirects: true

# ============================================
# 告警路由树
# ============================================
route:
  # 根路由 - 所有告��先到这里
  receiver: 'feishu'
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  # 嵌套路由规则
  routes:
    # Critical 告警 - 同时发飞书+短信
    - match:
        severity: 'critical'
      receiver: 'critical-pager'
      group_wait: 10s
      repeat_interval: 1h
      # 继续匹配更多规则
      routes:
        - match:
            alertname: 'DatabaseConnectionFailed'
          receiver: 'critical-pager'
          continue: false

    # 安全告警 - 单独通知安全组
    - match:
        team: 'security'
      receiver: 'dingtalk'
      group_by: ['alertname']

    # 基础设施告警 - 通知运维
    - match:
        team: 'infra'
      receiver: 'wecom'

    # 业务告警 - 邮件
    - match:
        team: 'ml'
      receiver: 'feishu'